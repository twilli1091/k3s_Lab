apiVersion: v1
kind: PersistentVolume
metadata:
  name: unraid-media-pv
spec:
  capacity:
    storage: 10Ti 
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany 
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /mnt/user/plex
    server: 10.0.0.5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unraid-media-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Ti
  volumeName: unraid-media-pv