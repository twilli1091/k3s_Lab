apiVersion: apps/v1
kind: Deployment
metadata:
  name: fan-control-manager
  namespace: fan-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fan-control
  template:
    metadata:
      labels:
        app: fan-control
    spec:
      nodeSelector:
          hardware: gpu-3060
      containers:
      - name: fan-controller
        image: twilli91/fan_control:v1.1
        resources:
          limits:
            nvidia.com/gpu: 1
        env:
          - name: IDRAC_IP
            valueFrom:
              secretKeyRef:
                name: fan-control-secrets 
                key: IDRAC_IP
          - name: IDRAC_USER
            valueFrom:
              secretKeyRef:
                name: fan-control-secrets 
                key: IDRAC_USER
          - name: IDRAC_PW
            valueFrom:
              secretKeyRef:
                name: fan-control-secrets
                key: IDRAC_PW