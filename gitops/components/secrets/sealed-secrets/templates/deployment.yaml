apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealed-secrets-ui
  namespace: sealed-secrets
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: sealed-secrets-ui
  template:
    metadata:
      labels:
        app: sealed-secrets-ui
    spec:
      containers:
      - name: ui
        image: alpheya/sealed-secrets-ui:latest
        ports:
        - containerPort: 8080
        env:
        - name: SEALED_SECRETS_CONTROLLER_NAMESPACE
          value: "kube-system"
        - name: SEALED_SECRETS_CONTROLLER_NAME
          value: "sealed-secrets-controller"
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi