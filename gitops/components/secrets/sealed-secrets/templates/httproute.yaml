apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sealed-secrets-route
  namespace: sealed-secrets 
spec:
  hostnames:
    - secret.10-0-0-200.nip.io
  parentRefs:
    - name: shared-gateway
      namespace: infrastructure
      group: gateway.networking.k8s.io # Good practice to keep this
      kind: Gateway
  rules:
    - matches: # You MUST have a match rule for the path
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sealed-secrets-ui
          namespace: sealed-secrets 
          port: 80
          weight: 1
          group: ""      
          kind: Service