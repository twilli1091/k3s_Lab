sealed-secrets:
  namespace: sealed-secrets
  image:
    registry: docker.io
    repository: bitnami/sealed-secrets-controller
    tag: "0.36.6" # Use a specific version for stability
    pullPolicy: IfNotPresent

# High Availability and Resource Management
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Security Context for k3s_lab (Rootless and Read-only)
podSecurityContext:
  enabled: true
  fsGroup: 65534

containerSecurityContext:
  enabled: true
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

# Enable Prometheus Metrics if you use a monitoring stack
metrics:
  enabled: true
  serviceMonitor:
    enabled: true # Set to true if using Prometheus Operator

# Key renewal settings
keyrenewperiod: "720h" # Renew the sealing key every 30 days