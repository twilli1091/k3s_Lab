apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  hostnames:
    - longhorn.10-0-0-200.nip.io
  parentRefs:
    - name: shared-gateway
      namespace: infrastructure
      group: gateway.networking.k8s.io # Good practice to keep this
      kind: Gateway
rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80