longhorn:
  defaultSettings:
    defaultDataPath: "/var/lib/longhorn"
    # Additional optimizations for Talos/home labs:
    taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule" 
  persistence:
    defaultClassReplicaCount: 3
    defaultClass: true
  csi:
    # Important for Talos: Ensures the CSI plugin uses the correct paths
    kubeletRootDir: "/var/lib/kubelet"