longhorn:
  defaultSettings:
    defaultDataPath: "/var/lib/longhorn"
    # Additional optimizations for k3s_lab/home labs:
    taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule" 
  persistence:
    defaultClassReplicaCount: 1
    defaultClass: true
  csi:
    # Important for k3s_lab: Ensures the CSI plugin uses the correct paths
    kubeletRootDir: "/var/lib/kubelet"
  preUpgradeChecker:
    jobEnabled: false