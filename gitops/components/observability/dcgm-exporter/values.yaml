dcgm-exporter:
  runtimeClassName: nvidia
  nodeSelector:
    nvidia.com/gpu.present: "true"
  
  rbac:
    create: true
  serviceAccount:
    create: true
    automountServiceAccountToken: true 

  serviceMonitor:
    enabled: true

  extraVolumes:
    - name: sa-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              items:
                - key: ca.crt
                  path: ca.crt
              name: kube-root-ca.crt
  extraVolumeMounts:
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: sa-token
      readOnly: true