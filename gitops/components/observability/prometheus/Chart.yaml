apiVersion: v2
name: prometheus-stack
description: A Helm chart for Prometheus monitoring on Talos using kube-prometheus-stack
type: application

# This version is for your internal tracking of this specific config
version: 1.0.0

# This is the version of the Prometheus stack you want to deploy
appVersion: "29.6.0"
dependencies:
  - name: prometheus
    version: 29.6.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: alertmanager
    version: 1.36.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: kube-state-metrics
    version: 7.3.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: prometheus-node-exporter
    version: 4.55.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: prometheus-pushgateway
    version: 3.6.0
    repository: https://prometheus-community.github.io/helm-charts