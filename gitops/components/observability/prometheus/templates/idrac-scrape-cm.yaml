apiVersion: v1
kind: ConfigMap
metadata:
  name: idrac-scrape-configs
  namespace: prometheus
data:
  idrac.yml: |
    - job_name: 'idrac'
      metrics_path: '/metrics'
      static_configs:
        - targets: ['10.0.0.129']
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: '10.0.0.5:9348'

    - job_name: 'idrac_snmp'
      metrics_path: '/snmp'
      params:
        module: [dell_power]
        auth: [public_v2]
      static_configs:
        - targets: ['10.0.0.129']
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: '10.0.0.5:9116'