apiVersion: v1
kind: Service
metadata:
  name: idrac-external-service
  namespace: prometheus
  labels:
    app: idrac-metrics
spec:
  clusterIP: None  
  ports:
    - name: metrics
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: idrac-external-service
  namespace: prometheus
subsets: 
  - addresses:
      - ip: 10.0.0.129
    ports:
      - name: metrics
        port: 443