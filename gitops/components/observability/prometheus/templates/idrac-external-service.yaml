apiVersion: v1
kind: Service
metadata:
  name: idrac-external-service
  namespace: prometheus
  labels:
    app: idrac-metrics
  annotations:
    metallb.universe.tf/address-pool: "home-lab-pool"
spec:
  type: LoadBalancer
  # clusterIP: None  
  ports:
    - name: metrics
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: idrac-external-service
  namespace: prometheus
  labels:
    kubernetes.io/service-name: idrac-external-service
addressType: IPv4
ports:
  - name: metrics
    port: 443
endpoints:
  - addresses:
      - "10.0.0.129"