apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: prometheus
spec:
  hostnames:
    - prom.10-0-0-200.nip.io
  parentRefs:
    - name: shared-gateway
      namespace: infrastructure
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          port: 9090
          weight: 1
          group: ""
          kind: Service
