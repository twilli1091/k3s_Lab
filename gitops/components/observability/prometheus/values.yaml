# Values for kube-prometheus-stack
prometheus:
  enabled: true
  prometheusSpec:
    # 1. ADD THESE TWO LINES
    # This tells Prometheus to automatically scrape ANY ServiceMonitor it finds


    # This replaces the old "server" block
    service:
      type: NodePort
      nodePort: 30090
    
    # Your iDRAC static configs stay exactly as they are
    additionalScrapeConfigs: 
      - job_name: 'idrac'
        metrics_path: '/metrics'
        static_configs:
          - targets:
            - 10.0.0.129
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: 'idrac-exporter.prometheus.svc.cluster.local:9110'

      - job_name: 'idrac_snmp'
        metrics_path: /snmp
        params:
          module: [dell_power]
          auth: [public_v2]
        static_configs:
          - targets:
            - 10.0.0.129
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: 'idrac-exporter.prometheus.svc.cluster.local:9110'

# Ensure the Operator is running to handle the CRDs
prometheusOperator:
  enabled: true
  # ArgoCD often needs this to manage CRD lifecycles
  crds:
    enabled: true