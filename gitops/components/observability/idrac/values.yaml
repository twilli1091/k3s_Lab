# MetalLB Integration
poolName: home-lab-pool
ipRange: "10.0.0.200-10.0.0.245"

# iDRAC Exporter Configuration
config: |
  env:
  - name: IDRAC_USER
    valueFrom:
      secretKeyRef:
        name: idrac-credentials
        key: username
  - name: IDRAC_PASS
    valueFrom:
      secretKeyRef:
        name: idrac-credentials
        key: password
  auths:
    default:
      username: "${IDRAC_USER}"
      password: "${IDRAC_PASS}"
  targets:
    10.0.0.129:  # Replace with your actual iDRAC IP
      auth: default

image:
  repository: ghcr.io/mrlhansen/idrac_exporter
  tag: latest

service:
  type: LoadBalancer