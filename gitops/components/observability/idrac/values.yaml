replicaCount: 1
# iDRAC Exporter Configuration
idracConfig: |
  port: 9348
  timeout: 60
  hosts:
    default:
      username: ${IDRAC_USER}
      password: ${IDRAC_PASS}
  metrics:
    all: true

env:
- name: IDRAC_USER
  valueFrom:
    secretKeyRef:
      name: idrac-credentials
      key: username
- name: IDRAC_PASS
  valueFrom:
    secretKeyRef:
      name: idrac-credentials
      key: password
image:
  repository: ghcr.io/mrlhansen/idrac_exporter
  pullPolicy: IfNotPresent

service:  
  port: 9110
  targetPort: 9348
  protocol: TCP
  name: http
  type: LoadBalancer

serviceAccount:
  create: true
  automount: true
  
prometheus:
  monitor:
    enabled: true
  idrac.yml: |
    - job_name: 'idrac'
      metrics_path: '/metrics'
      static_configs:
        - targets: ['10.0.0.129']
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: '10.0.0.201:9110'

    - job_name: 'idrac_snmp'
      metrics_path: '/snmp'
      params:
        module: [dell_power]
        auth: [public_v2]
      static_configs:
        - targets: ['10.0.0.129']
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: '10.0.0.201:9110'