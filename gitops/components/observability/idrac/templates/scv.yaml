apiVersion: v1
kind: Service
metadata:
  name: {{ include "idrac-exporter.fullname" . }}
  annotations:
    # This tells MetalLB which pool to use
    metallb.universe.tf/address-pool: {{ .Values.poolName | quote }}
spec:
  type: LoadBalancer
  ports:
    - port: 9110
      targetPort: 9110
      protocol: TCP
      name: http
  selector:
    app: idrac-exporter