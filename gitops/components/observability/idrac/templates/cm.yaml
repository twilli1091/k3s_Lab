apiVersion: v1
kind: ConfigMap
metadata:
  name: idrac-exporter
  namespace: prometheus 
data:
  idrac.yml: |
    env:
    - name: IDRAC_USER
      valueFrom:
        secretKeyRef:
          name: idrac-credentials
          key: username
    - name: IDRAC_PASS
      valueFrom:
        secretKeyRef:
          name: idrac-credentials
          key: password
    auths:
      default:
        username: "${IDRAC_USER}"
        password: "${IDRAC_PASS}"
    targets:
      10.0.0.129:
        auth: default