---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-monitor
  namespace: prometheus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: idrac-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__address__]
          regex: (.*):.*
          targetLabel: __param_target
          replacement: ${1}
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: idrac-exporter.prometheus.svc.cluster.local:9110