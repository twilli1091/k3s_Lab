---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-monitor
  namespace: prometheus
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: idrac-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        - action: replace
          sourceLabels:
            - __address__
          targetLabel: instance
        - action: replace      
          targetLabel: __address__
          replacement: 10.0.0.201:9348
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-snmp-monitor
  namespace: prometheus
  labels:
    release: prometheus-stack 
spec:
  selector:
    matchLabels:
      app: idrac-metrics
  endpoints:
    - port: metrics
      path: /snmp
      params:
        module: [dell_power]
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: 10.0.0.201:9110 