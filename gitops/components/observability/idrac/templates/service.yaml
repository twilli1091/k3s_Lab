apiVersion: v1
kind: Service
metadata:
  name: {{ include "idrac-exporter.fullname" . }}
  labels:
    {{- include "idrac-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "idrac-exporter.selectorLabels" . | nindent 4 }}