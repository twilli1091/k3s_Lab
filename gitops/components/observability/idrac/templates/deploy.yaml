apiVersion: apps/v1
kind: Deployment
metadata:
  name: idrac-exporter
  labels:
    app: idrac-exporter
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: idrac-exporter
  template:
    metadata:
      labels:
        app: idrac-exporter
    spec:
      containers:
        - name: idrac-exporter
          image: ghcr.io/mrlhansen/idrac_exporter:latest
          env:
            - name: IDRAC_USER
              valueFrom:
                secretKeyRef:
                  name: idrac-credentials
                  key: username
            - name: IDRAC_PASS
              valueFrom:
                secretKeyRef:
                  name: idrac-credentials
                  key: password
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: idrac-exporter 