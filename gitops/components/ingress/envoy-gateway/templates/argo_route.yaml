apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  hostnames:
    - argocd.10-0-0-200.nip.io
  parentRefs:
    - name: shared-gateway
      namespace: infrastructure
      group: gateway.networking.k8s.io # Good practice to keep this
      kind: Gateway
  rules:
    - matches: # You MUST have a match rule for the path
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          namespace: argocd # Important if the service is in a different NS
          port: 80
          weight: 1
          group: ""       # Explicitly set empty group for core Service
          kind: Service