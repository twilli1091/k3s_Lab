apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: infrastructure
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  listeners:
    - name: http1
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
