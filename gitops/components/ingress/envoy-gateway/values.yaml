# Configuration for the Envoy Gateway subchart
gateway-helm:
  installCRDs: true
  envoyGateway:
    service:
      type: NodePort
  namespace: infrastructure
# GatewayClass configuration
gatewayClass:
  name: envoy-gateway-class
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

deployment:
  metadata:
    namespace: infrastructure 