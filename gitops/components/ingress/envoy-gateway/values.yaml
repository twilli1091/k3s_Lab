gateway-helm:
  installCRDs: true
  # Configure the Envoy Gateway Controller
  config:
    envoyGateway:
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            # This forces the Proxy Pods/SVCs to be created in the 
            # namespace where your Gateway resource lives.
            type: GatewayNamespace

gatewayClass:
  name: envoy-gateway-class
  controllerName: gateway.envoyproxy.io/gatewayclass-controller