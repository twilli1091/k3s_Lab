apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drivers-mock-route
spec:
  parentRefs:
  - name: drivers-gateway
    namespace: drivers
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: drivers-mock-svc
      port: 80