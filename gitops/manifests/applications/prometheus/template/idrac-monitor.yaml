---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-monitor
  namespace: prometheus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: idrac-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: 10.0.0.5:9348 # Your Unraid Exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-snmp-monitor
  namespace: prometheus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: idrac-metrics
  endpoints:
    - port: metrics
      path: /snmp
      interval: 15s
      params:
        module: [dell_power]
        auth: [public_v2]
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: 10.0.0.5:9116 # Your Unraid SNMP Exporter