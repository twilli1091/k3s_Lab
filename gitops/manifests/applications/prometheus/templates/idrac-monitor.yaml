---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-monitor
  namespace: prometheus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: idrac-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__address__]
          targetLabel: __param_target
        - sourceLabels: [__param_target]
          targetLabel: instance
        - targetLabel: __address__
          replacement: 10.0.0.5:9348 # Your Unraid Exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: idrac-snmp-monitor
  namespace: prometheus
  labels:
    release: prometheus
spec:
  endpoints:
    - interval: 15s
      params:
        auth:
          - public_v2
        module:
          - dell_power
      path: /snmp
      port: metrics
      relabelings:
        - action: replace
          sourceLabels:
            - __address__
          targetLabel: __param_target
        - action: replace
          sourceLabels:
            - __param_target
          targetLabel: instance
        - action: replace
          replacement: '10.0.0.5:9116'
          targetLabel: __address__