apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
  - name: drivers-gateway
    namespace: drivers
  hostnames:
  - "argocd.default.svc.cluster.local" 
  rules:
  - backendRefs:
    - name: argocd-server
      port: 443