apiVersion: v1
kind: Secret
metadata:
  name: argocd-github-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  project: default
  url: {{ .Values.repo.url | quote }}
  username: {{ .Values.repo.username | quote }}
  password: {{ .Values.repo.password | quote }}