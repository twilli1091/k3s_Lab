# ---------------------------------------------------------
# VALUES FOR YOUR UMBRELLA CHART (Local Templates)
# ---------------------------------------------------------
httpRoute:
  enabled: true
  annotations: 
    meta.helm.sh/release-name: envoy-gateway                                                                                                                                                                     
    meta.helm.sh/release-namespace: envoy-gateway-system
  parentRefs: 
    - name: shared-gateway
      namespace: infrastructure
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - seerr.10-0-0-200.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: '' 
          kind: Service
          # CRITICAL: This must match the Service name generated by the upstream Seerr chart.
          # If your release name is "seerr", the service is usually just "seerr".
          name: seerr
          port: 80 # Seerr runs on port 5055 by default
          weight: 1

# ---------------------------------------------------------
# VALUES FOR THE UPSTREAM DEPENDENCY (Seerr)
# ---------------------------------------------------------
seerr:
  env:
    TZ: "America/New_York"
    PORT: "5055"
  
  # Ensure the upstream chart doesn't try to make its own ingress
  ingress:
    enabled: false
  
  persistence:
    config:
      enabled: true
      size: 5Gi
      storageClassName: 'longhorn'