apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "landing-page.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "landing-page.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ .Values.page.title }}</title>
        <style>
            body { font-family: sans-serif; background: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 2rem; margin: 0; }
            .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; width: 100%; max-width: 800px; }
            .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; text-decoration: none; color: #333; transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px;}
            .card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
            .card img { max-width: 64px; max-height: 64px; margin-bottom: 1rem; }
            h1 { margin-bottom: 2rem; color: #222; }
        </style>
    </head>
    <body>
        <h1>{{ .Values.page.title }}</h1>
        <div class="grid">
            {{- range .Values.page.links }}
            <a href="{{ .url }}" class="card">
                {{- if .icon }}
                <img src="{{ .icon }}" alt="{{ .name }} icon">
                {{- end }}
                <div>{{ .name }}</div>
            </a>
            {{- end }}
        </div>
    </body>
    </html>
