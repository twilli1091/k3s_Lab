{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "landing-page.fullname" . }}-route
  labels:
    app.kubernetes.io/name: {{ include "landing-page.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  hostnames:
    - {{ .Values.httpRoute.hostname }}
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayName }}
      namespace: {{ .Values.httpRoute.gatewayNamespace }}
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "landing-page.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
          group: ""
          kind: Service
{{- end }}
