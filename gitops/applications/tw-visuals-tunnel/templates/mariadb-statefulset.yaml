apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lychee-db
  namespace: tw-visuals
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: lychee-db
  replicas: 1
  selector:
    matchLabels:
      app: lychee-db
  template:
    metadata:
      labels:
        app: lychee-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.6
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: lychee
            - name: MYSQL_USER
              value: lychee
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data-pvc