apiVersion: apps/v1
kind: Deployment
metadata:
  name: tw-visuals-tunnel
  labels:
    app: tw-visuals-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tw-visuals-tunnel
  template:
    metadata:
      labels:
        app: tw-visuals-tunnel
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-token
              key: token