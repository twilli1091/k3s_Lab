apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lychee-uploads-pvc
  namespace: tw-visuals
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
