apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost-app
  namespace: tw-visuals
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: ghost-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost-app
  template:
    metadata:
      labels:
        app: ghost-app
    spec:
      containers:
        - name: ghost
          image: {{ .Values.ghost.image }}
          ports:
            - containerPort: 2368
          env:
            - name: url
              value: "https://{{ .Values.ghost.domain }}"
            - name: database__client
              value: mysql
            - name: database__connection__host
              value: ghost-db
            - name: database__connection__user
              value: ghost
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: ghost-secrets
                  key: DB_PASSWORD
            - name: database__connection__database
              value: ghost
            {{- if .Values.ghost.mail.enabled }}
            - name: mail__transport
              value: SMTP
            - name: mail__options__host
              value: smtp.gmail.com
            - name: mail__options__port
              value: "587"
            - name: mail__options__auth__user
              valueFrom:
                secretKeyRef:
                  name: ghost-mail-credentials
                  key: SMTP_USER
            - name: mail__options__auth__pass
              valueFrom:
                secretKeyRef:
                  name: ghost-mail-credentials
                  key: SMTP_PASSWORD
            - name: mail__from
              value: {{ .Values.ghost.mail.from | quote }}
            {{- end }}
          volumeMounts:
            - mountPath: /var/lib/ghost/content
              name: ghost-content
      volumes:
        - name: ghost-content
          persistentVolumeClaim:
            claimName: ghost-content-pvc