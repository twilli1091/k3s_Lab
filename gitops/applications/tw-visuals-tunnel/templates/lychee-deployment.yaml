apiVersion: apps/v1
kind: Deployment
metadata:
  name: lychee-app
  namespace: tw-visuals
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: lychee-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lychee-app
  template:
    metadata:
      labels:
        app: lychee-app
    spec:
      containers:
        - name: lychee
          image: twilli91/lychee:local-20261106193447
          ports:
            - containerPort: 8000
          env:
            - name: APP_KEY_RAW
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: APP_KEY
            - name: APP_KEY
              value: 'base64:$(APP_KEY_RAW)'
            - name: DB_CONNECTION
              value: mysql
            - name: DATABASE_URL
              value: ""
            - name: DB_HOST
              value: lychee-db
            - name: DB_DATABASE
              value: lychee
            - name: APP_URL
              value: https://twilliamsonvisuals.com
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              value: lychee
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - mountPath: /app/public/uploads
              name: lychee-uploads
      volumes:
        - name: lychee-uploads
          persistentVolumeClaim:
            claimName: lychee-uploads-pvc
