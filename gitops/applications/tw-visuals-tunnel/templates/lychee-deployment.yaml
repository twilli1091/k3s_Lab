apiVersion: apps/v1
kind: Deployment
metadata:
  name: lychee-app
  namespace: tw-visuals
  labels:
    app: lychee-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lychee-app
  template:
    metadata:
      labels:
        app: lychee-app
    spec:
      containers:
        - name: lychee
          image: lycheeorg/lychee:latest
          ports:
            - containerPort: 80
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: APP_KEY
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_DATABASE
              value: lychee
            - name: DB_PORT
              value: "3306"
            - name: DB_USERNAME
              value: lychee
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - mountPath: /uploads
              name: lychee-uploads
        - name: mariadb
          image: mariadb:10.6
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: lychee
            - name: MYSQL_USER
              value: lychee
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lychee-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mariadb-data
      volumes:
        - name: lychee-uploads
          persistentVolumeClaim:
            claimName: lychee-uploads-pvc
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data-pvc