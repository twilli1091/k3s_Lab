apiVersion: apps/v1
kind: Deployment
metadata:
  name: lychee-app
  namespace: tw-visuals
  labels:
    app: lychee-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lychee-app
  template:
    metadata:
      labels:
        app: lychee-app
    spec:
      containers:
        - name: lychee
          image: lycheeorg/lychee:latest
          ports:
            - containerPort: 80
          env:
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mariadb-tw-visuals
            - name: DB_DATABASE
              value: lychee
            - name: DB_USERNAME
              value: lychee
            - name: DB_PASSWORD
              value: "secure-lychee-password"
          volumeMounts:
            - mountPath: /uploads
              name: lychee-uploads
        - name: mariadb
          image: mariadb:10.6
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root-password"
            - name: MYSQL_DATABASE
              value: lychee
            - name: MYSQL_USER
              value: lychee
            - name: MYSQL_PASSWORD
              value: "secure-lychee-password"
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mariadb-data
      volumes:
        - name: lychee-uploads
          persistentVolumeClaim:
            claimName: lychee-uploads-pvc
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data-pvc