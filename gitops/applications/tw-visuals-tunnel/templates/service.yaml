apiVersion: v1
kind: Service
metadata:
  name: lychee-svc
  namespace: tw-visuals
spec:
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: lychee-app
---
apiVersion: v1
kind: Service
metadata:
  name: lychee-db
  namespace: tw-visuals
spec:
  clusterIP: None
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: lychee-db