apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tw-visuals-route
  namespace: tw-visuals
spec:
  hostnames:
    - twilliamsonvisuals.com
    - www.twilliamsonvisuals.com
  parentRefs:
    - name: shared-gateway
      namespace: infrastructure
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: YOUR_WEB_SERVICE_NAME # Replace with your Nginx or Portfolio service name
          port: 80
          weight: 1