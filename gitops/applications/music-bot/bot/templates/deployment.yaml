apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-bot-deployment
  namespace: music-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: music-bot
  template:
    metadata:
      labels:
        app: music-bot
    spec:
      containers:
        - name: httpbin
          image: twilli91/music-bot:v2.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80