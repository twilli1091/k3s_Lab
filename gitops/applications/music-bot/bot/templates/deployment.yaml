apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-bot-deployment
  namespace: music-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: music-bot
  template:
    metadata:
      labels:
        app: music-bot
    spec:
      containers:
        - image: twilli91/music-bot:v2.1
          name: music-bot
          env:
            # Defines an environment variable for the tunnel token.
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-token
                  key: token
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80