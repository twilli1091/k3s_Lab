apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd 
spec:
  ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: prometheus-alertmanager
    namespace: prometheus
    jsonPointers:
    - /spec/volumeClaimTemplates/0/apiVersion
    - /spec/volumeClaimTemplates/0/kind
  project: default
  source:
    repoURL: 'https://github.com/twilli1091/k3s_lab.git'
    targetRevision: HEAD
    path: gitops/components/observability/prometheus 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true