apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-time-slice
  namespace: argocd # Child apps must live in the argocd namespace
spec:
  project: default
  source:
    repoURL: 'https://github.com/twilli1091/k3s_lab.git'
    targetRevision: HEAD
    path: gitops/components/gpu
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nvidia-device-plugin+ # Where it actually deploys
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jsonPointers:
          - /status/terminatingReplicas