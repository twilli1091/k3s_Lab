apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/your-repo.git
    path: gitops/components/gpu/ # Path to where your Chart.yaml lives
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-device-plugin
  syncPolicy:
    automated: {}