apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/twilli1091/k3s_lab.git'  # Change to your Git repo
    targetRevision: HEAD                                            # Your branch
    path: gitops/components/storage/longhorn/                                  # Path to your Chart.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Still critical for Longhorn's massive CRDs