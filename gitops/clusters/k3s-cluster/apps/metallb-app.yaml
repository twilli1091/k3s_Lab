apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: 'https://github.com/twilli1091/k3s_lab.git'
    targetRevision: HEAD
    path: gitops/components/networking/metallb/ 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true


