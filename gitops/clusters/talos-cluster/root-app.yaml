apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/twilli1091/Talos.git'
      targetRevision: HEAD
      path: gitops/manifests/infrastructure/envoy-gateway-bootstrap
    # - repoURL: 'https://github.com/twilli1091/Talos.git'
    #   targetRevision: HEAD
    #   path: gitops/manifests/applications/drivers-api-mock
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true       # <--- FIX 1: Use the server, not the client
      - ClientSideApplyMigration=false # <--- FIX 2: Stop trying to "fix" old annotations
