apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd # Child apps must live in the argocd namespace
spec:
  project: default
  source:
    repoURL: 'https://github.com/twilli1091/Talos.git'
    targetRevision: HEAD
    path: gitops/manifests/infrastructure/envoy-gateway-bootstrap # Points to your chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: envoy-gateway-system # Where it actually deploys
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true